<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#101418" />
  <title>Project Drive</title>
</head>
<body class="in-menu">
  <div id="game"></div>
  <div id="loading">PROJECT DRIVE<br><small>Завантаження світу…</small></div>


  <div id="menu">
    <div class="menu-shade"></div>
    <button id="gearBtn" class="gear" aria-label="Налаштування">
      <svg viewBox="-50 -50 100 100"><g fill="#cdb98a" stroke="#4a3b22" stroke-width="3"><path id="gp" d="M-9 -46 h18 l3 12 q6 2 11 6 l12 -4 9 15 -9 9 q1 6 0 12 l9 9 -9 15 -12 -4 q-5 4 -11 6 l-3 12 h-18 l-3 -12 q-6 -2 -11 -6 l-12 4 -9 -15 9 -9 q-1 -6 0 -12 l-9 -9 9 -15 12 4 q5 -4 11 -6z"/></g><circle r="17" fill="#2a2d31" stroke="#4a3b22" stroke-width="3"/><circle r="9" fill="#6d737a"/></svg>
    </button>
    <div class="nick"><label for="nickIn">НІК</label><input id="nickIn" maxlength="14" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Гравець"></div>
    <div class="logo"><span class="l1">PROJECT</span><span class="l2">DRIVE</span></div>
    <div class="menu-btns">
      <button id="playBtn" class="mbtn green">ГРАТИ</button>
      <button id="mpBtn" class="mbtn blue">МУЛЬТИПЛЕЄР (P2P)</button>
    </div>
    <div id="mp" class="hidden">
      <div class="panel wide">
        <h2>МУЛЬТИПЛЕЄР (P2P)</h2>
        <div class="net-status" id="netStatus">Підключення до мережі…</div>
        <div class="row-label">СТВОРИТИ СЕРВЕР</div>
        <div class="create">
          <input id="srvName" maxlength="24" autocomplete="off" spellcheck="false" placeholder="Назва сервера">
          <button id="createBtn" class="mbtn green small">СТВОРИТИ</button>
        </div>
        <div class="row-label">СПИСОК СЕРВЕРІВ (до 5 гравців)</div>
        <div id="srvList" class="srv-list"></div>
        <p class="mp-err" id="mpErr"></p>
        <button id="mpBack" class="mbtn blue small">НАЗАД</button>
      </div>
    </div>
    <div id="settings" class="hidden">
      <div class="panel">
        <h2>НАЛАШТУВАННЯ</h2>
        <div class="row-label">ГРАФІКА</div>
        <div class="seg" id="qualitySeg">
          <button data-q="high">ВИСОКА</button>
          <button data-q="mid">СЕРЕДНЯ</button>
          <button data-q="low">НИЗЬКА</button>
        </div>
        <p id="qualityNote"></p>
        <div class="row-label" style="margin-top:16px">ЗВУК</div>
        <div class="seg" id="soundSeg"><button data-s="1">УВІМК</button><button data-s="0">ВИМК</button></div>
        <button id="closeSettings" class="mbtn green small">ГОТОВО</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="hud">
    <div class="topline">
      <div class="brand">PROJECT <b>DRIVE</b></div>
      <div class="status">JEEP · 0 м</div>
    </div>
    <div class="speedbox">
      <div id="speed">0</div>
      <span>KM/H</span>
      <div id="gear">N</div>
    </div>
    <div id="players"></div>
    <div class="hint" id="hint">W/S — газ / задній · Space — гальмо · A/D — руль · C — камера<br>або крутіть руль на екрані</div>
    <button id="cameraBtn" class="camera">КАМЕРА</button>
    <button id="menuBtn" class="camera q">МЕНЮ</button>

    <div id="wheel" aria-label="Руль">
      <svg viewBox="-50 -50 100 100">
        <circle r="43" fill="none" stroke="#ffffff55" stroke-width="12"/>
        <circle r="43" fill="none" stroke="#161b20" stroke-width="9"/>
        <line x1="-43" y1="0" x2="43" y2="0" stroke="#161b20" stroke-width="7"/>
        <line x1="0" y1="0" x2="0" y2="43" stroke="#161b20" stroke-width="7"/>
        <circle r="10" fill="#161b20" stroke="#ffffff55" stroke-width="1.5"/>
        <line x1="0" y1="-47" x2="0" y2="-39" stroke="#b8ff3d" stroke-width="3.5"/>
      </svg>
    </div>

    <div class="pedals">
      <button data-key="ArrowDown" class="rev">R</button>
      <button data-key="Space" class="brake">ГАЛЬМО</button>
      <button data-key="ArrowUp" class="gas">ГАЗ</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
